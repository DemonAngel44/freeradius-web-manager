version: '3.8'

services:
  freeradius-web-manager:
    build: .
    container_name: freeradius-web-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - RADIUS_SERVER=${RADIUS_SERVER:-10.11.101.221}
      - RADIUS_PORT=${RADIUS_PORT:-1812}
      - RADIUS_SECRET=${RADIUS_SECRET:-VPNRadius2024!}
      - USERS_FILE=/data/authorize
      - ADMIN_GROUP_PREFIX=${ADMIN_GROUP_PREFIX:-ADM-}
      - FREERADIUS_CONTAINER=${FREERADIUS_CONTAINER:-freeradius}
    volumes:
      # Mount FreeRADIUS users file
      - radius_users:/data:rw
      # Mount docker socket for reload command
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - radius-net

volumes:
  radius_users:
    external: true
    name: freeradius_config  # Adjust to match your FreeRADIUS volume

networks:
  radius-net:
    external: true
    name: nginx-proxy-manager_default  # Adjust to match your network
