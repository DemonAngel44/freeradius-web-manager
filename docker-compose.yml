version: '3.8'

services:
  freeradius-web-manager:
    build: .
    container_name: freeradius-web-manager
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - RADIUS_SERVER=${RADIUS_SERVER:-localhost}
      - RADIUS_PORT=${RADIUS_PORT:-1812}
      - RADIUS_SECRET=${RADIUS_SECRET}
      - USERS_FILE=/data/authorize
      - ADMIN_GROUP_PREFIX=${ADMIN_GROUP_PREFIX:-}
      - FREERADIUS_CONTAINER=${FREERADIUS_CONTAINER:-freeradius}
      - SETUP_COMPLETE_FILE=/data/.setup_complete
    volumes:
      # Mount FreeRADIUS config directory (adjust path as needed)
      - radius_config:/data:rw
      # Mount docker socket for reload command (optional)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - radius-net

volumes:
  radius_config:
    external: true
    name: freeradius_config  # Adjust to match your FreeRADIUS volume

networks:
  radius-net:
    external: true
    name: freeradius_network  # Adjust to match your network
